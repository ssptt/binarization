<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像2値化ツール</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            background-color: #f0f2f5;
        }
        .container {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin: 20px 0;
            background: #fafafa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .control-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .control-group label {
            flex: 1;
            font-weight: bold;
        }
        .control-group input[type="range"] {
            flex: 2;
            margin: 0 15px;
        }
        .control-group input[type="number"] {
            width: 70px;
            padding: 5px;
            font-family: monospace;
            text-align: right;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        canvas {
            max-width: 100%;
            border: 1px dashed #aaa;
            background-color: #fff;
            margin-top: 10px;
        }
        .checkbox-group {
            margin-top: 15px;
            font-size: 14px;
        }
        button {
            padding: 12px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            width: 100%;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>画像2値化ツール</h2>
    
    <input type="file" id="imageInput" accept="image/jpeg, image/jpg, image/png, image/webp">
    
    <div class="controls" id="controls" style="display:none;">
        <div class="control-group">
            <label for="rotSlider">回転</label>
            <input type="range" id="rotSlider" min="-180" max="180" value="0" step="90">
            <input type="number" id="rotNum" min="-180" max="180" value="0" step="90">
        </div>
        <div class="control-group">
            <label for="widthSlider">幅</label>
            <input type="range" id="widthSlider" min="100" max="1200" value="512" step="1">
            <input type="number" id="widthNum" min="100" max="1200" value="512" step="1">
        </div>
        <div class="control-group">
            <label for="brightSlider">明るさ</label>
            <input type="range" id="brightSlider" min="0.1" max="3.0" value="1.1" step="0.1">
            <input type="number" id="brightNum" min="0.1" max="3.0" value="1.1" step="0.1">
        </div>
        <div class="control-group">
            <label for="contrastSlider">コントラスト</label>
            <input type="range" id="contrastSlider" min="0.1" max="3.0" value="1.2" step="0.1">
            <input type="number" id="contrastNum" min="0.1" max="3.0" value="1.2" step="0.1">
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <div class="checkbox-group" id="optionsGroup" style="display:none;">
        <label for="scaleCheckbox" style="cursor: pointer; user-select: none;">
            <input type="checkbox" id="scaleCheckbox" style="margin-right: 8px;">
            画像を2倍にアップスケールする
        </label>
    </div>

    <button id="downloadBtn" style="display:none;">画像をダウンロード</button>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const downloadBtn = document.getElementById('downloadBtn');
    const controls = document.getElementById('controls');
    const optionsGroup = document.getElementById('optionsGroup');
    const scaleCheckbox = document.getElementById('scaleCheckbox');

    let sourceImage = null;

    // スライダーと数値入力フォームのペア設定
    const paramPairs = [
        { slider: 'rotSlider', num: 'rotNum' },
        { slider: 'widthSlider', num: 'widthNum' },
        { slider: 'brightSlider', num: 'brightNum' },
        { slider: 'contrastSlider', num: 'contrastNum' }
    ];

    // 双方向同期の設定
    paramPairs.forEach(pair => {
        const sliderEl = document.getElementById(pair.slider);
        const numEl = document.getElementById(pair.num);

        sliderEl.addEventListener('input', function() {
            numEl.value = this.value;
            if (sourceImage) processImage();
        });

        numEl.addEventListener('input', function() {
            sliderEl.value = this.value;
            if (sourceImage) processImage();
        });
    });

    imageInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            sourceImage = new Image();
            sourceImage.onload = function() {
                controls.style.display = 'grid';
                optionsGroup.style.display = 'block';
                downloadBtn.style.display = 'block';
                processImage();
            }
            sourceImage.src = event.target.result;
        }
        reader.readAsDataURL(file);
    });

    function processImage() {
        const rot = parseFloat(document.getElementById('rotNum').value);
        const targetWidth = parseInt(document.getElementById('widthNum').value);
        const brightFactor = parseFloat(document.getElementById('brightNum').value);
        const contrastFactor = parseFloat(document.getElementById('contrastNum').value);

        const rad = rot * Math.PI / 180;
        const sin = Math.abs(Math.sin(rad));
        const cos = Math.abs(Math.cos(rad));
        
        const rotatedWidth = sourceImage.width * cos + sourceImage.height * sin;
        const rotatedHeight = sourceImage.width * sin + sourceImage.height * cos;

        const scale = targetWidth / rotatedWidth;
        const targetHeight = Math.floor(rotatedHeight * scale);

        canvas.width = targetWidth;
        canvas.height = targetHeight;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.filter = `brightness(${brightFactor * 100}%) contrast(${contrastFactor * 100}%)`;

        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(rad);
        ctx.scale(scale, scale);
        
        ctx.drawImage(sourceImage, -sourceImage.width / 2, -sourceImage.height / 2);

        ctx.setTransform(1, 0, 0, 1, 0, 0); 
        ctx.filter = 'none';

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        const width = canvas.width;
        const height = canvas.height;

        const grayData = new Float32Array(width * height);
        for (let i = 0; i < data.length; i += 4) {
            grayData[i / 4] = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
        }

        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                const idx = y * width + x;
                const oldPixel = grayData[idx];
                const newPixel = oldPixel >= 128 ? 255 : 0;
                grayData[idx] = newPixel;
                
                const error = oldPixel - newPixel;
                
                if (x + 1 < width) 
                    grayData[idx + 1] += error * (7 / 16);
                if (x - 1 >= 0 && y + 1 < height) 
                    grayData[idx + width - 1] += error * (3 / 16);
                if (y + 1 < height) 
                    grayData[idx + width] += error * (5 / 16);
                if (x + 1 < width && y + 1 < height) 
                    grayData[idx + width + 1] += error * (1 / 16);
            }
        }

        for (let i = 0; i < grayData.length; i++) {
            const val = Math.max(0, Math.min(255, grayData[i]));
            const dataIdx = i * 4;
            data[dataIdx] = val;
            data[dataIdx+1] = val;
            data[dataIdx+2] = val;
            data[dataIdx+3] = 255;
        }

        ctx.putImageData(imageData, 0, 0);
    }

    downloadBtn.addEventListener('click', function() {
        let downloadCanvas = canvas;

        if (scaleCheckbox.checked) {
            const offscreenCanvas = document.createElement('canvas');
            offscreenCanvas.width = canvas.width * 2;
            offscreenCanvas.height = canvas.height * 2;
            const offCtx = offscreenCanvas.getContext('2d');

            offCtx.imageSmoothingEnabled = false;
            offCtx.drawImage(canvas, 0, 0, offscreenCanvas.width, offscreenCanvas.height);
            downloadCanvas = offscreenCanvas;
        }

        const link = document.createElement('a');
        link.download = 'img.png';
        link.href = downloadCanvas.toDataURL('image/png');
        link.click();
    });
</script>

</body>
</html>
